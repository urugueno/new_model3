# twoperson_meeting_03 twoperson_meeting_04 twoperson_meeting_07 twoperson_meeting_08 twoperson_meeting_09 twoperson_meeting_10 twoperson_meeting_11
defaults:
  tracker: sam3
  area_size: 1.8
  bbox_size: 0.6
  people: 2
  detect: False
jobs:
  # 複数人（people >= 2）では persons で人物ごとに track_id 一覧と開始フェーズを指定する。
  # ids には、その人物に対応する（不安定な）track_id をすべて列挙する。
  # start_phase は t=0 でその人物が居るフェーズ（0〜5、cycle_phases=6 のため）。
  #   phase 0,1 -> walk / 2 -> stop / 3 -> crouch / 4 -> hand / 5 -> bow（除外）
  # ids の値は各データの bbox_label.csv の person_id 列を確認して埋めること。
  # track_id が途中で別人に乗り移った場合は、その id を区間で分ける:
  #   ids: [1, {id: 9, to: 20260129_083945_703176.jpg},]   # 9 はこの時刻まで
  #   ids: [2, {id: 9, from: 20260129_083945_703176.jpg},] # 以降は別の人物
  #   from は含み to は含まない。同じ時刻を to と from に書けば穴も重なりも出ない。
  #   同じ id に from だけ / to だけを並べると、書いた順に区間を開いて閉じると読む:
  #     ids: [{id: 29, from: A}, {id: 29, to: B}]   -> A から B まで の 1 区間
  #     ids: [{id: 29, to: A}, {id: 29, from: B}]   -> A まで と B から の 2 区間
  # 収録中にサイクルを飛ばして以降の位相がずれた場合は shifts で補正する（delta 省略で 1）:
  #   persons の中に書けばその人物だけ、job 直下に書けば全行（1人データはこちら）に効く。
  #     shifts: [{from: 20260129_084644_593751.jpg, delta: 1}]
  - data: twoperson_meeting_03
    start_img: /path/to/nas/data/raw/light/twoperson_meeting_03/color/20260123_113829_198538.jpg
    cycle_phases: 6
    drop_phases: [5]
    persons:
      - ids: [1,]
        start_phase: 2 #shibuya
      - ids: [2,]
        start_phase: 3 #moriwaki
  - data: twoperson_meeting_04
    start_img: /path/to/nas/data/raw/light/twoperson_meeting_04/color/20260123_122054_275747.jpg
    cycle_phases: 6
    drop_phases: [5]
    persons:
      - ids: [2,6,9,10,15,]
        start_phase: 2 #shibuya
      - ids: [1,4,]
        start_phase: 3 #Li
  - data: twoperson_meeting_07
    start_img: /path/to/nas/data/raw/light/twoperson_meeting_07/color/20260123_132944_172276.jpg
    cycle_phases: 6
    drop_phases: [5]
    persons:
      - ids: [1,5,8,]
        start_phase: 2 #shibuya
      - ids: [2,3,]
        start_phase: 3 #kojima
  - data: twoperson_meeting_08
    start_img: /path/to/nas/data/raw/light/twoperson_meeting_08/color/20260123_133759_136274.jpg
    cycle_phases: 6
    drop_phases: [5]
    persons:
      - ids: [1,]
        start_phase: 2 #shibuya
      - ids: [2,]
        start_phase: 3 #hariguchi
  - data: twoperson_meeting_09
    start_img: /path/to/nas/data/raw/light/twoperson_meeting_09/color/20260129_124734_325433.jpg
    persons:
      - ids: [1,]
        start_phase: 2 #kojima
      - ids: [3,]
        start_phase: 3 #hariguchi
  - data: twoperson_meeting_10
    start_img: /path/to/nas/data/raw/light/twoperson_meeting_10/color/20260129_125314_330118.jpg
    persons:
      - ids: [1,]
        start_phase: 2 #tunoda
      - ids: [2,]
        start_phase: 3 #hariguchi
  - data: twoperson_meeting_11
    start_img: /path/to/nas/data/raw/light/twoperson_meeting_11/color/20260129_125949_521446.jpg
    persons:
      - ids: [1,]
        start_phase: 2 #kojima
      - ids: [2,]
        start_phase: 3 #tsunoda
    shifts: [{from: 20260129_130144_543678.jpg, delta: 1}]

# nohup python Illuminance_DETR/preprocessing/preprocess_real/main_batch.py Illuminance_DETR/preprocessing/preprocess_real/batch/twoperson_meeting.yaml --gpu 0 > ./log/log_twoperson_meeting.out 2>&1 &
